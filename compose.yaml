services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://assist:${POSTGRES_PASSWORD}@db:5432/assist
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assist
      POSTGRES_USER: assist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - assist-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assist"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  assist-db:
